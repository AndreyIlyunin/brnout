<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>burnout — простейшие картинки меню (превью)</title>
<style>
  body{background:#0d0a12;color:#d8c9be;font-family:IBM Plex Mono,monospace;
       display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px}
  h2{font-size:13px;font-weight:400;color:#9be3d5;letter-spacing:.1em}
  .row{display:flex;gap:14px}
  .card{width:150px;height:170px;border:1px solid #2c2430;border-radius:10px;
        background:linear-gradient(160deg,#1b1522,#0f0b14);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .card .nm{font-size:11px;color:#b7a8b0}
  .emoji{font-size:74px;line-height:1}
  .plate{width:88px;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center}
  svg{display:block}
</style>
</head>
<body>
<h2>ВАРИАНТ А — эмодзи (одна строка кода на класс, ноль итераций)</h2>
<div class="row" id="rowA"></div>
<h2>ВАРИАНТ Б — плоский SVG (3-5 фигур на класс, правится за минуты)</h2>
<div class="row" id="rowB"></div>
<script>
var CLS = [
  {k:'mgr', nm:'МЕНЕДЖЕР',  e:'\u{1F9D1}\u200D\u{1F4BC}', c:'#42e0ff'},
  {k:'dev', nm:'ПРОГЕР',    e:'\u{1F9D1}\u200D\u{1F4BB}', c:'#5fd0c2'},
  {k:'mkt', nm:'МАРКЕТОЛОГ',e:'\u{1F9D1}\u200D\u{1F4C8}', c:'#c8a2ff'},
  {k:'dsn', nm:'ДИЗАЙНЕР',  e:'\u{1F9D1}\u200D\u{1F3A8}', c:'#ff7ab8'}
];
// А: эмодзи на классовой плашке
CLS.forEach(function(c){
  var d=document.createElement('div'); d.className='card';
  d.innerHTML='<div class="plate" style="background:'+c.c+'22;border:1px solid '+c.c+'55">'
    +'<span class="emoji">'+c.e+'</span></div><div class="nm">'+c.nm+'</div>';
  document.getElementById('rowA').appendChild(d);
});
// Б: минималистичный SVG-бюст: голова+плечи+акцент класса
var ACC = {
  mgr:'<path d="M38 52 L50 52 L50 62 L44 62 L44 56 L38 56 Z" fill="#42e0ff"/><path d="M44 52 h12 v10 h-6 v-6 h-6 z" fill="#2a6d80"/>',
  dev:'<path d="M28 30 Q44 18 60 30 L60 52 Q44 46 28 52 Z" fill="#2c3a44"/><path d="M36 44 h16 v10 h-16 z" fill="#5fd0c2" opacity=".85"/>',
  mkt:'<rect x="30" y="42" width="18" height="12" rx="2" fill="#c8a2ff"/><path d="M48 44 L62 36 v24 L48 52 Z" fill="#8f5fd0"/>',
  dsn:'<path d="M30 26 Q44 14 58 26 L58 32 Q44 24 30 32 Z" fill="#ff7ab8"/><rect x="58" y="40" width="14" height="3" rx="1.5" fill="#ff7ab8" transform="rotate(35 58 40)"/>'
};
CLS.forEach(function(c){
  var svg = '<svg width="88" height="88" viewBox="0 0 88 88">'
    +'<rect width="88" height="88" rx="16" fill="'+c.c+'18"/>'
    +'<path d="M14 88 Q14 62 34 56 L54 56 Q74 62 74 88 Z" fill="'+c.c+'40"/>'  // плечи
    +'<circle cx="44" cy="36" r="17" fill="'+c.c+'66"/>'                        // голова
    +'<circle cx="38" cy="35" r="1.8" fill="#0d0a12"/><circle cx="50" cy="35" r="1.8" fill="#0d0a12"/>'
    +'<path d="M40 43 Q44 45 48 43" stroke="#0d0a12" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
    + ACC[c.k] + '</svg>';
  var d=document.createElement('div'); d.className='card';
  d.innerHTML='<div class="plate">'+svg+'</div><div class="nm">'+c.nm+'</div>';
  document.getElementById('rowB').appendChild(d);
});
</script>
</body>
</html>
