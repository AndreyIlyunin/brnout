<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>burnout — производные портреты от оригинала (превью)</title>
<style>
  body{background:#141018;color:#d8c9be;font-family:IBM Plex Mono,monospace;
       display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px}
  h2{font-size:13px;font-weight:400;color:#9be3d5;letter-spacing:.08em;margin:4px 0 0}
  .row{display:flex;gap:18px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;gap:5px;align-items:center}
  canvas{image-rendering:pixelated;border:1px solid #3a2c34;background:#000}
  .lbl{font-size:11px;color:#8f7f78}
  #orig{width:208px;height:224px}
  .out{width:390px;height:300px}
  .warn{font-size:11px;color:#c9845e;max-width:820px;text-align:center}
</style>
</head>
<body>
<h2>ОРИГИНАЛ → ДИЗАЙНЕР → ПРОГРАММИСТ (производные на нашей сетке, в игру не подключено)</h2>
<div class="row">
  <div class="cell"><canvas id="orig" width="260" height="280"></canvas><div class="lbl">оригинал (референс)</div></div>
  <div class="cell"><canvas id="dsn" class="out" width="65" height="50"></canvas><div class="lbl">ДИЗАЙНЕР — перекраска + детали</div></div>
  <div class="cell"><canvas id="dev" class="out" width="65" height="50"></canvas><div class="lbl">ПРОГРАММИСТ — капюшон + очки</div></div>
</div>
<div class="warn">оригинал — стоковое изображение (shutterstock): в игру идёт только переработанная производная на нашей сетке и палитре</div>
<script>
(function(){
  var img = new Image();
  img.onload = function(){ run(); };
  img.src = 'ref-original.jpg';

  function run(){
    document.getElementById('orig').getContext('2d').drawImage(img,0,0);

    // --- квантование в родную плотность оригинала: 65x50 ---
    var SW=260, SH=200, CS=4, GW=65, GH=50;
    var off = document.createElement('canvas'); off.width=SW; off.height=SH;
    var oc = off.getContext('2d');
    oc.drawImage(img,0,0,SW,SH);
    var px = oc.getImageData(0,0,SW,SH).data;

    var grid = [];
    for(var gy=0; gy<GH; gy++){
      var row=[];
      for(var gx=0; gx<GW; gx++){
        var r=0,g=0,b=0,n=0;
        for(var yy=0; yy<CS; yy++) for(var xx=0; xx<CS; xx++){
          var i=((gy*CS+yy)*SW+(gx*CS+xx))*4;
          r+=px[i]; g+=px[i+1]; b+=px[i+2]; n++;
        }
        row.push({r:Math.round(r/n), g:Math.round(g/n), b:Math.round(b/n)});
      }
      grid.push(row);
    }

    // --- классификация ---
    var seeds = [
      {n:'bg',     c:[139,129,122]},
      {n:'bgL',    c:[172,165,159]},
      {n:'hair',   c:[33,29,32]},
      {n:'jacket', c:[38,33,41]},
      {n:'skin',   c:[234,182,155]},
      {n:'skinSh', c:[201,143,120]},
      {n:'top',    c:[217,213,201]},
      {n:'pink',   c:[224,85,157]},
      {n:'blue',   c:[74,104,176]},
      {n:'lips',   c:[96,42,48]},
      {n:'white',  c:[239,233,224]}
    ];
    function classify(cell){
      var best=null, bd=1e9;
      seeds.forEach(function(s){
        var d=(cell.r-s.c[0])*(cell.r-s.c[0])+(cell.g-s.c[1])*(cell.g-s.c[1])+(cell.b-s.c[2])*(cell.b-s.c[2]);
        if(d<bd){bd=d;best=s.n;}
      });
      return best;
    }
    var cls = grid.map(function(row){ return row.map(function(c){ return classify(c); }); });

    // подбородок: последняя непрерывная строка лица в центральной колонке
    var chinY = 14;
    for(var fy=10; fy<GH; fy++){
      var cnt=0;
      for(var fx=30; fx<=36; fx++) if(cls[fy][fx]==='skin'||cls[fy][fx]==='skinSh') cnt++;
      if(cnt>=4) chinY=fy; else if(fy>chinY+1) break;
    }
    // границы лица
    var faceX0=GW, faceX1=0, faceY0=GH;
    for(var yy=6; yy<=chinY; yy++) for(var xx=20; xx<46; xx++){
      var k=cls[yy][xx];
      if(k==='skin'||k==='skinSh'){ faceX0=Math.min(faceX0,xx); faceX1=Math.max(faceX1,xx); faceY0=Math.min(faceY0,yy); }
    }

    // тёмные классы: над подбородком — волосы, ниже — косуха
    for(var y2=0;y2<GH;y2++) for(var x2=0;x2<GW;x2++){
      if(cls[y2][x2]==='hair') cls[y2][x2] = (y2<=chinY+1) ? 'hair' : 'jacket';
    }

    // чистка полутоновых зёрен
    var SOLID={bg:1,bgL:1,hair:1,jacket:1};
    var SPECK={lips:1,skin:1,skinSh:1,white:1,pink:1,blue:1,top:1};
    for(var pass=0;pass<2;pass++){
      var re=[];
      for(var y5=0;y5<GH;y5++){
        re[y5]=[];
        for(var x5=0;x5<GW;x5++){
          var k5=cls[y5][x5], nk=k5;
          if(SPECK[k5]){
            var nb={};
            if(y5>0&&SOLID[cls[y5-1][x5]]) nb[cls[y5-1][x5]]=(nb[cls[y5-1][x5]]||0)+1;
            if(y5<GH-1&&SOLID[cls[y5+1][x5]]) nb[cls[y5+1][x5]]=(nb[cls[y5+1][x5]]||0)+1;
            if(x5>0&&SOLID[cls[y5][x5-1]]) nb[cls[y5][x5-1]]=(nb[cls[y5][x5-1]]||0)+1;
            if(x5<GW-1&&SOLID[cls[y5][x5+1]]) nb[cls[y5][x5+1]]=(nb[cls[y5][x5+1]]||0)+1;
            var bn=null,bc=0;
            for(var kk in nb) if(nb[kk]>bc){bc=nb[kk];bn=kk;}
            if(bc>=3) nk=bn;
          }
          re[y5][x5]=nk;
        }
      }
      cls=re;
    }

    // глаза: тёмные (hair-класс) клетки внутри лица, окружённые кожей
    var eyeCells=[];
    for(var ey=faceY0+2; ey<=chinY-1; ey++) for(var ex=faceX0; ex<=faceX1; ex++){
      if(cls[ey][ex]!=='hair') continue;
      var sn=0;
      for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
        if(!dy&&!dx) continue;
        var q=cls[ey+dy]&&cls[ey+dy][ex+dx];
        if(q==='skin'||q==='skinSh'||q==='lips') sn++;
      }
      if(sn>=5) eyeCells.push([ex,ey]);
    }
    // губы: lips-клетки в нижней трети лица
    var lipCells=[];
    for(var ly=Math.floor(chinY-4); ly<=chinY; ly++) for(var lx=faceX0; lx<=faceX1; lx++){
      if(cls[ly][lx]==='lips') lipCells.push([lx,ly]);
    }

    // дебаг
    var bb={};
    for(var y3=0;y3<GH;y3++) for(var x3=0;x3<GW;x3++){
      var kk=cls[y3][x3];
      if(!bb[kk]) bb[kk]={x0:99,x1:-1,y0:99,y1:-1,n:0};
      var B=bb[kk]; B.n++;
      B.x0=Math.min(B.x0,x3);B.x1=Math.max(B.x1,x3);
      B.y0=Math.min(B.y0,y3);B.y1=Math.max(B.y1,y3);
    }
    var fm='';
    for(var y6=faceY0-1;y6<=chinY+1;y6++){
      for(var x6=faceX0-2;x6<=faceX1+2;x6++){
        var k6=cls[y6][x6];
        fm += k6==='hair'?'h': k6==='skin'?'s': k6==='skinSh'?'S': k6==='white'?'w': k6==='lips'?'l': k6==='top'?'t': k6==='bg'||k6==='bgL'?'.': k6==='jacket'?'j':'?';
      }
      fm+='\n';
    }
    window.QDBG={bbox:bb,chinY:chinY,faceX0:faceX0,faceX1:faceX1,faceY0:faceY0,eyeCells:eyeCells,lipCells:lipCells,faceMap:fm};

    // --- отрисовка ---
    function hx(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
    function render(cvId, pal, edits){
      var cv=document.getElementById(cvId), c=cv.getContext('2d');
      for(var y=0;y<GH;y++) for(var x=0;x<GW;x++){
        var k=cls[y][x], base=pal[k] && hx(pal[k]);
        if(!base) continue;
        var cell=grid[y][x];
        var lum=(cell.r+cell.g+cell.b)/3;
        var sd=seeds.filter(function(s){return s.n===k;})[0];
        var sl=(sd.c[0]+sd.c[1]+sd.c[2])/3;
        var f=Math.max(0.82,Math.min(1.18,lum/sl));
        c.fillStyle='rgb('+Math.round(base[0]*f)+','+Math.round(base[1]*f)+','+Math.round(base[2]*f)+')';
        c.fillRect(x,y,1,1);
      }
      (edits||function(){})(c);
    }

    // ================= ДИЗАЙНЕР =================
    render('dsn', {
      bg:'#b7a49e', bgL:'#c4b2ab',
      hair:'#26222b',
      jacket:'#45242e',
      skin:'#eec9b6', skinSh:'#d19b88',
      top:'#d8cfc2',
      pink:'#47b8a4',
      blue:'#e56b8c',
      lips:'#8a3a44',
      white:'#f6f1e6'
    }, function(c){
      // тил-прядь в чёлке (слева над лицом)
      c.fillStyle='#47b8a4';
      [[faceX0+3,faceY0-1],[faceX0+4,faceY0],[faceX0+5,faceY0+1],[faceX0+2,faceY0],[faceX0+4,faceY0+2]]
        .forEach(function(p){c.fillRect(p[0],p[1],1,1);});
      // ухмылка: приподнимаем правый уголок рта
      if(lipCells.length){
        var mx=-1,my=-1;
        lipCells.forEach(function(p){ if(p[0]>mx){mx=p[0];my=p[1];} });
        c.fillStyle='#8a3a44'; c.fillRect(mx+1,my-1,1,1);
      }
      // золотая подвеска на чокере
      for(var cy=chinY+1; cy<=chinY+4; cy++){
        var dark=0;
        for(var cx2=faceX0+2; cx2<=faceX1-2; cx2++) if(cls[cy][cx2]==='hair'||cls[cy][cx2]==='jacket') dark++;
        if(dark>=3){ c.fillStyle='#e2a84e'; c.fillRect(Math.round((faceX0+faceX1)/2),cy,1,1); break; }
      }
      // принт: насыщенные клетки топа перекрашиваем
      for(var y=0;y<GH;y++) for(var x=0;x<GW;x++){
        if(cls[y][x]!=='top') continue;
        var cell=grid[y][x], mx2=Math.max(cell.r,cell.g,cell.b), mn=Math.min(cell.r,cell.g,cell.b);
        if(mx2-mn<35) continue;
        c.fillStyle = cell.r>cell.b ? '#47b8a4' : '#e56b8c';
        c.fillRect(x,y,1,1);
      }
    });

    // ================= ПРОГРАММИСТ =================
    render('dev', {
      bg:'#2a2632', bgL:'#332e3c',
      hair:'#262c38',
      jacket:'#232028',
      skin:'#e3c2ae', skinSh:'#c39a88',
      top:'#3a4048',
      pink:'#5fd0c2',
      blue:'#5fd0c2',
      lips:'#a8808a',
      white:'#f6f1e6'
    }, function(c){
      // кайма капюшона по внешнему силуэту волос
      for(var y=0;y<GH;y++) for(var x=0;x<GW;x++){
        if(cls[y][x]!=='hair') continue;
        var edge =
          (y===0||cls[y-1][x]==='bg'||cls[y-1][x]==='bgL') ||
          (y===GH-1||cls[y+1][x]==='bg'||cls[y+1][x]==='bgL') ||
          (x===0||cls[y][x-1]==='bg'||cls[y][x-1]==='bgL') ||
          (x===GW-1||cls[y][x+1]==='bg'||cls[y][x+1]==='bgL');
        if(edge){ c.fillStyle='#171b24'; c.fillRect(x,y,1,1); }
      }
      // очки: линзы светлые + рамка тёмная вокруг найденных глаз
      if(eyeCells.length){
        var ex0=99,ex1=-1,ey0=99,ey1=-1;
        eyeCells.forEach(function(p){
          ex0=Math.min(ex0,p[0]);ex1=Math.max(ex1,p[0]);
          ey0=Math.min(ey0,p[1]);ey1=Math.max(ey1,p[1]);
        });
        var mid=Math.round((ex0+ex1)/2);
        var L={x0:ex0-1,x1:mid-1}, R={x0:mid+1,x1:ex1+1};
        var ty=ey0-1, by=ey1+1;
        c.fillStyle='rgba(160,220,255,0.20)';
        c.fillRect(L.x0,ty,L.x1-L.x0+1,by-ty+1);
        c.fillRect(R.x0,ty,R.x1-R.x0+1,by-ty+1);
        c.fillStyle='#12161f';
        [[L.x0,ty,L.x1-L.x0+1,1],[L.x0,by,L.x1-L.x0+1,1],[L.x0,ty,1,by-ty+1],[L.x1,ty,1,by-ty+1],
         [R.x0,ty,R.x1-R.x0+1,1],[R.x0,by,R.x1-R.x0+1,1],[R.x0,ty,1,by-ty+1],[R.x1,ty,1,by-ty+1],
         [mid,ey0,1,1],[ex0-3,ty+1,3,1],[ex1+1,ty+1,3,1]
        ].forEach(function(r){ c.fillRect(r[0],r[1],r[2],r[3]); });
      }
      // принт: насыщенные клетки топа -> мятные (код)
      for(var y2=0;y2<GH;y2++) for(var x2=0;x2<GW;x2++){
        if(cls[y2][x2]!=='top') continue;
        var cell=grid[y2][x2], mx=Math.max(cell.r,cell.g,cell.b), mn=Math.min(cell.r,cell.g,cell.b);
        if(mx-mn>=35){ c.fillStyle='#5fd0c2'; c.fillRect(x2,y2,1,1); }
      }
    });

    console.log('QDBG', JSON.stringify(window.QDBG));
  }
})();
</script>
</body>
</html>
