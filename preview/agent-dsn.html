<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДИЗАЙНЕР — превью (не в игре)</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(620px 420px at 18% 12%, rgba(47,191,174,.10), transparent 60%),
      radial-gradient(700px 500px at 84% 88%, rgba(255,95,168,.09), transparent 62%),
      radial-gradient(900px 700px at 50% 50%, #171126 0%, #0d0a16 70%);
    color: #cfc6dd;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; min-height: 100vh;
    padding: 24px; box-sizing: border-box;
  }
  canvas#portrait {
    width: 512px; height: 416px;
    image-rendering: auto;
    border-radius: 12px;
    box-shadow:
      0 18px 50px rgba(0,0,0,.6),
      0 0 0 1px #2a2438,
      0 0 34px rgba(63,227,205,.12),
      0 0 60px rgba(255,95,168,.07);
  }
  .caption {
    font-size: 14px; letter-spacing: .12em;
    text-transform: uppercase; color: #9b8fb5;
    text-shadow: 0 0 14px rgba(63,227,205,.35);
  }
  .caption b { color: #7ef0dd; font-weight: 700; }
  @media (max-width: 560px) {
    canvas#portrait { width: 100%; height: auto; max-width: 512px; }
  }
</style>
</head>
<body>
<canvas id="portrait" width="256" height="208"></canvas>
<div class="caption"><b>ДИЗАЙНЕР</b> — превью (не в игре)</div>
<script>
"use strict";
(() => {
  const cv = document.getElementById("portrait");
  const g = cv.getContext("2d");

  // ------- детерминированный PRNG (mulberry32): портрет одинаков при каждой загрузке -------
  let _s = 20261020;
  const rnd = () => {
    _s |= 0; _s = (_s + 0x6D2B79F5) | 0;
    let t = Math.imul(_s ^ (_s >>> 15), 1 | _s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const jit = (a) => (rnd() * 2 - 1) * a;

  // ------- палитра -------
  const INK = "#241434";            // «чернила маркера»
  const C = {
    bgDeep:  "#150e21",
    skin:    "#f6cfa2",
    skinSh:  "#e0ab77",
    hair:    "#7a4a2a",             // каштановое каре (рефы 3, 6)
    hairSh:  "#57301b",             // задняя масса
    hairHi:  "#9c6538",             // карамельная прядь
    hoodie:  "#e2a53c",             // горчичное худи (реф 7)
    hoodieSh:"#b97f26",
    tee:     "#f4795b",             // коралловая футболка (реф 3)
    phones:  "#2fbfae",             // бирюзовые наушники (реф 2)
    phonesSh:"#1f8f81",
    penCap:  "#17655c",
    eyeW:    "#fdfbf6",
    pupil:   "#2c1a10",
    blush:   "#f2a08c",
    lip:     "#e2705c",
    gold:    "#e8b64c",
    neonT:   "rgba(63,227,205,",
    neonM:   "rgba(255,95,168,"
  };

  // ------- геометрия: точки -> квадратичные сегменты -------
  function smoothSegments(pts, closed) {
    const n = pts.length, segs = [];
    if (n < 2) return segs;
    if (closed) {
      for (let i = 0; i < n; i++) {
        const p0 = pts[i], p1 = pts[(i + 1) % n], p2 = pts[(i + 2) % n];
        segs.push({
          x0: (p0[0] + p1[0]) / 2, y0: (p0[1] + p1[1]) / 2,
          cx: p1[0], cy: p1[1],
          x1: (p1[0] + p2[0]) / 2, y1: (p1[1] + p2[1]) / 2
        });
      }
    } else {
      if (n === 2) {
        const p0 = pts[0], p1 = pts[1];
        segs.push({ x0: p0[0], y0: p0[1], cx: (p0[0] + p1[0]) / 2, cy: (p0[1] + p1[1]) / 2, x1: p1[0], y1: p1[1] });
        return segs;
      }
      for (let i = 1; i < n - 1; i++) {
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        const m1 = (i === 1) ? p0 : [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
        const m2 = (i === n - 2) ? p2 : [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
        segs.push({ x0: m1[0], y0: m1[1], cx: p1[0], cy: p1[1], x1: m2[0], y1: m2[1] });
      }
    }
    return segs;
  }

  // «маркерный» контур: дрожание точек + толщина гуляет по сегментам, 2 прохода
  function ink(pts, opt) {
    const o = Object.assign({ w: 3, jitter: 1.0, closed: false, color: INK, passes: 2 }, opt || {});
    g.save();
    g.strokeStyle = o.color;
    g.lineCap = "round"; g.lineJoin = "round";
    for (let k = 0; k < o.passes; k++) {
      const jp = pts.map((p) => [p[0] + jit(o.jitter), p[1] + jit(o.jitter * 0.8)]);
      const segs = smoothSegments(jp, o.closed);
      const wk = o.w * (k === 0 ? 1 : 0.8);
      for (const s of segs) {
        g.beginPath();
        g.moveTo(s.x0, s.y0);
        g.quadraticCurveTo(s.cx, s.cy, s.x1, s.y1);
        g.lineWidth = Math.max(0.6, wk * (0.72 + rnd() * 0.56));
        g.stroke();
      }
    }
    g.restore();
  }

  // плоская заливка по сглаженному контуру
  function fillFlat(pts, color) {
    const segs = smoothSegments(pts, true);
    if (!segs.length) return;
    g.beginPath();
    g.moveTo(segs[0].x0, segs[0].y0);
    for (const s of segs) g.quadraticCurveTo(s.cx, s.cy, s.x1, s.y1);
    g.closePath();
    g.fillStyle = color;
    g.fill();
  }

  // заливка + маркерный контур
  function blob(pts, fill, opt) {
    const o = Object.assign({ w: 3.2, jitter: 1.0 }, opt || {});
    fillFlat(pts.map((p) => [p[0] + jit(o.jitter * 0.6), p[1] + jit(o.jitter * 0.5)]), fill);
    ink(pts, { w: o.w, jitter: o.jitter, closed: true, passes: o.passes || 2 });
  }

  function ellipsePts(cx, cy, rx, ry, n, wob) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const w = 1 + (wob ? jit(wob) : 0);
      pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]);
    }
    return pts;
  }

  function dot(x, y, r, color) {
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    g.fillStyle = color; g.fill();
  }

  // ================================== 1. ФОН: тёмный неон ==================================
  g.fillStyle = C.bgDeep;
  g.fillRect(0, 0, 256, 208);
  const glow = g.createRadialGradient(128, 84, 18, 128, 84, 112);
  glow.addColorStop(0, "rgba(94,52,140,.5)");
  glow.addColorStop(1, "rgba(94,52,140,0)");
  g.fillStyle = glow;
  g.fillRect(0, 0, 256, 208);

  // неоновое кольцо за головой
  g.strokeStyle = C.neonT + ".55)"; g.lineWidth = 2;
  g.beginPath(); g.arc(128, 92, 88, 0.15, Math.PI * 2 + 0.1); g.stroke();
  g.strokeStyle = C.neonM + ".3)"; g.lineWidth = 2;
  g.beginPath(); g.arc(128, 92, 100, -0.9, 1.6); g.stroke();

  // искры и «штрихи дизайнера» по углам
  dot(36, 34, 2, C.neonT + ".85)");
  dot(214, 42, 2.4, C.neonM + ".8)");
  dot(28, 148, 1.8, C.neonM + ".7)");
  dot(226, 146, 2, C.neonT + ".7)");
  dot(198, 18, 1.5, C.neonT + ".6)");
  dot(52, 186, 1.6, C.neonM + ".5)");
  g.strokeStyle = C.neonM + ".55)"; g.lineWidth = 1.6; g.lineCap = "round";
  g.beginPath(); g.moveTo(14, 60); g.bezierCurveTo(26, 48, 34, 66, 46, 54); g.stroke();
  g.strokeStyle = C.neonT + ".5)";
  g.beginPath(); g.moveTo(212, 178); g.bezierCurveTo(226, 168, 230, 186, 244, 176); g.stroke();

  // ============================ 2. ВОЛОСЫ ЗАДНИЕ (тёмная масса) ============================
  blob([
    [128, 16], [168, 22], [190, 44], [198, 78], [202, 116], [204, 152],
    [200, 182], [186, 202], [150, 196], [128, 200], [106, 196], [70, 202],
    [56, 182], [52, 152], [54, 116], [58, 78], [66, 44], [88, 22]
  ], C.hairSh, { w: 3.4, jitter: 1.5 });

  //================================= 3. ШЕЯ + плечи =================================
  blob([
    [115, 126], [111, 146], [113, 156], [122, 162], [134, 162], [143, 156],
    [145, 146], [142, 126]
  ], C.skin, { w: 2.8, jitter: 0.8 });
  fillFlat([[113, 132], [145, 132], [143, 148], [115, 148]], C.skinSh); // тень под челюстью

  // ================================ 4. ОДЕЖДА: горчичное худи ================================
  blob([
    [100, 146], [76, 152], [56, 164], [44, 182], [38, 208],
    [218, 208], [212, 182], [200, 164], [180, 152], [156, 146]
  ], C.hoodie, { w: 3.6, jitter: 1.3 });
  // тень у ворота
  fillFlat([[104, 150], [152, 150], [148, 162], [128, 168], [108, 162]], C.hoodieSh);
  // коралловая футболка в вырезе (реф 3)
  blob([[110, 152], [146, 152], [128, 174]], C.tee, { w: 2.6, jitter: 0.7 });
  // окантовка ворота
  ink([[108, 149], [128, 159], [148, 149]], { w: 3, jitter: 0.6 });
  // шнурки худи
  ink([[117, 158], [114, 170], [116, 182]], { w: 2.2, jitter: 0.5, passes: 1 });
  ink([[139, 158], [142, 170], [140, 180]], { w: 2.2, jitter: 0.5, passes: 1 });
  dot(116, 184, 2.2, C.tee);
  dot(140, 182, 2.2, C.tee);
  // карман-кенгуру
  ink([[96, 190], [112, 194], [144, 194], [160, 190]], { w: 2.4, jitter: 0.5, passes: 1 });
  // швы плечей
  ink([[80, 156], [72, 168]], { w: 1.8, passes: 1, jitter: 0.3 });
  ink([[176, 156], [184, 168]], { w: 1.8, passes: 1, jitter: 0.3 });

  // ================================ 5. ЛИЦО (большая голова) ================================
  blob([
    [128, 26], [156, 30], [172, 52], [176, 84], [168, 110], [152, 128],
    [136, 137], [126, 138], [112, 134], [96, 124], [84, 106], [78, 82],
    [82, 52], [98, 32]
  ], C.skin, { w: 3.4, jitter: 1.1 });
  fillFlat([[95, 54], [128, 48], [161, 54], [159, 64], [128, 58], [97, 64]], C.skinSh); // тень под чёлкой

  // ============================ 6. ВОЛОСЫ ПЕРЕДНИЕ: рваная чёлка ============================
  // торчащие вихры на макушке и боках (растрёпанность — рефы 3, 10)
  blob([[96, 22], [100, 6], [112, 18]], C.hair, { w: 2.4, jitter: 0.5 });
  blob([[146, 18], [158, 8], [156, 22]], C.hair, { w: 2.4, jitter: 0.5 });
  blob([[68, 62], [56, 50], [70, 54]], C.hair, { w: 2.4, jitter: 0.5 });
  blob([[188, 62], [200, 50], [186, 54]], C.hair, { w: 2.4, jitter: 0.5 });

  blob([
    [84, 58], [92, 28], [114, 14], [138, 14], [158, 26], [172, 44], [178, 60],
    [168, 52], [158, 44], [150, 62], [140, 46], [130, 60], [118, 44], [108, 60],
    [96, 46], [88, 56]
  ], C.hair, { w: 3.4, jitter: 1.0 });
  // карамельный бликовый локон в чёлке
  blob([[122, 26], [132, 22], [136, 40], [126, 44], [118, 34]], C.hairHi, { w: 2.2, jitter: 0.5 });
  // штрихи-текстура
  ink([[138, 24], [142, 36]], { w: 1.6, passes: 1, jitter: 0.3 });
  ink([[112, 30], [108, 42]], { w: 1.6, passes: 1, jitter: 0.3 });

  // боковые пряди, обрамляющие лицо и падающие на плечи
  blob([
    [84, 52], [76, 72], [72, 98], [74, 124], [78, 148], [70, 168], [82, 178],
    [90, 150], [86, 120], [90, 92], [96, 66]
  ], C.hair, { w: 3.2, jitter: 1.0 });
  blob([
    [172, 52], [180, 72], [184, 98], [182, 124], [178, 148], [186, 168], [174, 178],
    [166, 150], [170, 120], [166, 92], [160, 66]
  ], C.hair, { w: 3.2, jitter: 1.0 });
  ink([[79, 92], [82, 122]], { w: 1.6, passes: 1, jitter: 0.3 });
  ink([[177, 92], [174, 122]], { w: 1.6, passes: 1, jitter: 0.3 });

  // свободная прядь перед лбом (случившийся акцент)
  blob([
    [122, 16], [127, 36], [122, 52], [111, 68], [106, 62], [115, 44], [118, 28]
  ], C.hair, { w: 2.2, jitter: 0.6 });

  // ===================== 6b. МАРКЕР-МАРКЕР за ухом (дизайнерский реквизит) =====================
  blob([[69, 81], [75, 79], [65, 51], [59, 53]], C.tee, { w: 2.2, jitter: 0.4 });   // корпус
  blob([[59.5, 53], [65.5, 51], [60.5, 37], [54.5, 39]], C.penCap, { w: 2.2, jitter: 0.4 }); // колпачок
  ink([[58, 45], [63, 44]], { w: 1.4, passes: 1, jitter: 0.2 });                    // клипса

  // ============================ 6c. НАУШНИКИ (реф 2): дуга + чашки ============================
  blob([
    [72, 90], [80, 52], [96, 24], [124, 12], [152, 16], [172, 38], [184, 80],
    [174, 80], [160, 42], [140, 28], [118, 30], [102, 52], [82, 90]
  ], C.phones, { w: 2.8, jitter: 0.7 });
  // чашки над ушами
  blob(ellipsePts(74, 96, 14, 15, 14, 0.05), C.phones, { w: 3, jitter: 0.6 });
  blob(ellipsePts(182, 96, 14, 15, 14, 0.05), C.phones, { w: 3, jitter: 0.6 });
  fillFlat(ellipsePts(74, 96, 8, 9, 12, 0.04), C.phonesSh);
  fillFlat(ellipsePts(182, 96, 8, 9, 12, 0.04), C.phonesSh);
  dot(74, 96, 2, C.hoodie); dot(182, 96, 2, C.hoodie); // горчичная точка-фурнитура
  // золотые серьги-кольца, свисающие из-под чашек
  g.strokeStyle = C.gold; g.lineWidth = 2.2; g.lineCap = "round";
  ink([[74, 108], [74, 113]], { w: 2, passes: 1, jitter: 0.2, color: C.gold });
  ink([[182, 108], [182, 113]], { w: 2, passes: 1, jitter: 0.2, color: C.gold });
  g.beginPath(); g.arc(74, 118, 4.5, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(182, 118, 4.5, 0, Math.PI * 2); g.stroke();

  // ================================ 7. ЧЕРТЫ ЛИЦА ================================
  // глаза: крупные белки, тяжёлые веки (вайб Judge/Daria)
  blob([[93, 85], [99, 77], [110, 77], [117, 83], [114, 91], [103, 93], [95, 91]], C.eyeW, { w: 2.6, jitter: 0.5 });
  blob([[141, 85], [147, 77], [158, 77], [165, 83], [162, 91], [151, 93], [143, 91]], C.eyeW, { w: 2.6, jitter: 0.5 });
  dot(107.5, 86, 4.4, C.pupil);
  dot(155.5, 86, 4.4, C.pupil);
  dot(106, 84.6, 1.3, C.eyeW);
  dot(154, 84.6, 1.3, C.eyeW);
  ink([[91, 84], [101, 75], [112, 76], [119, 85]], { w: 4.6, jitter: 0.4 });   // жирное верхнее веко L
  ink([[138, 84], [148, 75], [159, 76], [166, 85]], { w: 4.6, jitter: 0.4 });  // ... R
  ink([[91, 84], [85, 79]], { w: 2.8, passes: 1, jitter: 0.3 });               // крыло стрелки L
  ink([[166, 85], [172, 80]], { w: 2.8, passes: 1, jitter: 0.3 });             // ... R
  ink([[98, 94], [105, 96]], { w: 1.8, passes: 1, jitter: 0.3 });              // нижнее веко L
  ink([[146, 94], [153, 96]], { w: 1.8, passes: 1, jitter: 0.3 });             // ... R

  // брови: левая ровно, правая высоко (уверенная дерзость)
  ink([[91, 66], [104, 61], [117, 64]], { w: 4.2, jitter: 0.6 });
  ink([[140, 61], [153, 53], [166, 58]], { w: 4.2, jitter: 0.6 });

  // нос: маленький, парой штрихов
  ink([[128, 90], [125, 100], [129, 105]], { w: 2.6, jitter: 0.4 });
  ink([[129, 105], [133, 102]], { w: 2, passes: 1, jitter: 0.3 });

  // рот: асимметричная ухмылка с приподнятым уголком
  ink([[110, 119], [123, 123], [136, 117]], { w: 3.6, jitter: 0.5 });
  ink([[136, 117], [143, 111]], { w: 2.8, passes: 1, jitter: 0.3 });
  fillFlat([[136, 117], [143, 111], [141, 119]], INK);       // приоткрытый уголок
  fillFlat([[116, 123], [132, 121], [128, 127], [119, 127]], C.lip); // губы
  dot(140, 105, 1.4, INK);                                   // родинка

  // румяна
  fillFlat(ellipsePts(98, 107, 6, 3.6, 10, 0.05), C.blush);
  fillFlat(ellipsePts(158, 107, 6, 3.6, 10, 0.05), C.blush);
})();
</script>
</body>
</html>
